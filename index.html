<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR GEM | مستر جم</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #080510;
      color: white;
      min-height: 100vh;
    }

    .top {
      background: linear-gradient(90deg, #250044, #6500a8, #250044);
      padding: 8px 15px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      border-bottom: 2px solid #9d00ff;
    }

    header {
      height: 70px;
      background: linear-gradient(90deg, #26003f, #560080, #26003f);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 5px 25px rgba(166, 0, 255, .35);
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #d000ff;
    }

    .menu {
      font-size: 30px;
      cursor: pointer;
    }

    .welcome {
      text-align: center;
      margin: 35px 15px 25px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 10px;
      color: #fff;
    }

    .welcome p {
      color: #c9b5d5;
      font-size: 14px;
    }

    .game-card {
      width: calc(100% - 30px);
      max-width: 500px;
      margin: 25px auto;
      background: #130b1b;
      border: 2px solid #8c00c9;
      border-radius: 25px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(165, 0, 255, .25);
      transition: .2s;
    }

    .game-card:active {
      transform: scale(.97);
    }

    .game-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .game-title {
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: linear-gradient(90deg, #32004e, #7000a5);
    }

    .game-title small {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      color: #e6c9f1;
      font-weight: normal;
    }

    .footer {
      text-align: center;
      color: #89758f;
      font-size: 12px;
      padding: 40px 10px 25px;
    }

    .side-menu {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100%;
      background: #100817;
      z-index: 100;
      padding: 25px;
      box-shadow: -5px 0 30px rgba(0,0,0,.7);
    }

    .side-menu h2 {
      color: #d000ff;
      margin-bottom: 30px;
    }

    .side-menu button {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #8c00c9;
      border-radius: 12px;
      background: #1d0c27;
      color: white;
      font-size: 15px;
    }

    .close {
      position: absolute;
      left: 20px;
      top: 20px;
      font-size: 25px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="top">
    💎 به مستر جم خوش آمدید 💎
  </div>

  <header>
    <div class="logo">
      <span>MR</span> GEM
    </div>

    <div class="menu" onclick="openMenu()">☰</div>
  </header>

  <section class="welcome">
    <h1>مستر جم</h1>
    <p>مرکز خرید جم و محصولات فری فایر</p>
  </section>

  <!-- کارت فری فایر -->
  <div class="game-card" onclick="goToFreeFire()">

    <img src="5692.jpg" alt="Free Fire">

    <div class="game-title">
      فری فایر
      <small>خرید جم فری فایر</small>
    </div>

  </div>

  <div class="footer">
    MR GEM © 2026
  </div>

  <!-- منوی سه خط -->
  <div class="side-menu" id="sideMenu">

    <div class="close" onclick="closeMenu()">×</div>

    <h2>MR GEM</h2>

    <button onclick="telegram()">
      📱 پشتیبانی تلگرام
    </button>

    <button onclick="orders()">
      🧾 سفارشات
    </button>

  </div>

  <script>
    function goToFreeFire() {
      window.location.href = "freefire.html";
    }function openMenu() {
      document.getElementById("sideMenu").style.display = "block";
    }

    function closeMenu() {
      document.getElementById("sideMenu").style.display = "none";
    }

    function telegram() {
      alert("لینک پشتیبانی تلگرام را بعداً اضافه می‌کنیم.");
    }

    function orders() {
      alert("صفحه سفارشات را در مرحله بعد اضافه می‌کنیم.");
    }
  </script>

</body>
</html>
