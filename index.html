<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مستر جم | خرید جم Free Fire</title>

    <meta name="description"
          content="مستر جم - خرید جم فری فایر با ثبت سفارش آنلاین. MR GEM">

    <meta name="keywords"
          content="مستر جم, MR GEM, خرید جم فری فایر, جم Free Fire">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #080808;
            color: #ffffff;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b2100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #f5c542;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            color: #f5c542;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, #151000, #080808);
        }

        .hero h1 {
            font-size: 45px;
            color: #f5c542;
            margin-bottom: 20px;
        }

        .hero p {
            color: #cccccc;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #f5c542;
            color: #000;
            padding: 14px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .packages {
            padding: 60px 8%;
        }

        .packages h2 {
            text-align: center;
            color: #f5c542;
            margin-bottom: 40px;
            font-size: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #111111;
            border: 1px solid #2b2100;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
        }

        .card h3 {
            color: #f5c542;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .card p {
            color: #cccccc;
            margin-bottom: 20px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #2b2100;
            color: #888888;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 32px;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MR GEM</div>

    <nav>
        <a href="#">خانه</a>
        <a href="#packages">پکیج جم</a>
        <a href="#contact">تماس با ما</a>
    </nav>
</header>

<section class="hero">
    <h1>مستر جم</h1>

    <p>
        فروش جم Free Fire با ثبت سفارش آنلاین
    </p>

    <a class="btn" href="#packages">
        مشاهده پکیج‌ها
    </a>
</section>

<section class="packages" id="packages">

    <h2>پکیج‌های جم Free Fire</h2>

    <div class="cards">

        <div class="card">
            <h3>100 💎</h3>
            <p>پکیج اقتصادی</p>
            <div class="price">قیمت به‌زودی</div>
            <a class="btn" href="#">خرید</a>
        </div>

        <div class="card">
            <h3>310 💎</h3>
            <p>پکیج محبوب</p>
            <div class="price">قیمت به‌زودی</div>
            <a class="btn" href="#">خرید</a>
        </div><div class="card">
            <h3>520 💎</h3>
            <p>پکیج ویژه</p>
            <div class="price">قیمت به‌زودی</div>
            <a class="btn" href="#">خرید</a>
        </div>

        <div class="card">
            <h3>1060 💎</h3>
            <p>پکیج حرفه‌ای</p>
            <div class="price">قیمت به‌زودی</div>
            <a class="btn" href="#">خرید</a>
        </div>

    </div>

</section>

<footer id="contact">
    © 2026 MR GEM - مستر جم
</footer>

</body>
</html>
